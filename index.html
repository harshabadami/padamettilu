<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ಪದಮೆಟ್ಟಿಲು — Kannada Word Ladder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Tamma+2:wght@500;600;700;800&family=Noto+Sans+Kannada:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#faf5ea; --ink:#2e2318; --muted:#8a7a64;
  --accent:#c2571b; --accent-soft:#f6e3d2;
  --good:#2e7d4f; --good-soft:#dff0e4;
  --card:#fffdf8; --line:#e7dcc6;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0; background:var(--paper); color:var(--ink);
  font-family:"Noto Sans Kannada","Baloo Tamma 2",system-ui,sans-serif;}
.wrap{max-width:540px; margin:0 auto; padding:16px 16px 40px;}
header{text-align:center; padding:18px 0 6px;}
h1{font-family:"Baloo Tamma 2","Noto Sans Kannada",sans-serif; font-size:2.4rem;
  margin:0; color:var(--accent); letter-spacing:.5px;}
.tag{color:var(--muted); font-size:.95rem; margin-top:2px;}
.modes{display:flex; gap:8px; justify-content:center; margin:14px 0;}
.modes button{border:2px solid var(--line); background:var(--card); color:var(--ink);
  border-radius:999px; padding:8px 18px; font-size:1rem; font-family:inherit; cursor:pointer;}
.modes button.on{background:var(--ink); color:var(--paper); border-color:var(--ink);}
.meta{display:flex; justify-content:space-between; align-items:center;
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:10px 14px; margin-bottom:14px; font-size:.95rem;}
.meta .streak{font-weight:700;}
#ladder{display:flex; flex-direction:column; gap:8px; margin-bottom:14px;}
.rung{background:var(--card); border:2px solid var(--line); border-radius:12px;
  padding:10px 14px; display:flex; justify-content:space-between; align-items:center;
  font-size:1.5rem; font-weight:600;}
.rung .gloss{font-size:.85rem; color:var(--muted); font-weight:400;}
.rung.start{border-color:var(--good); background:var(--good-soft);}
.rung.end{border-style:dashed; border-color:var(--accent); background:var(--accent-soft);}
.rung.cur{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);}
.rung .taglbl{font-size:.7rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted);}
#entry{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px;}
#guess{width:100%; font-size:1.6rem; padding:10px 12px; border:2px solid var(--line);
  border-radius:10px; font-family:inherit; background:#fff;}
#guess:focus{outline:none; border-color:var(--accent);}
.hintline{font-size:.8rem; color:var(--muted); margin:6px 2px 0;}
#latinprev{min-height:1.3em; font-size:.95rem; color:var(--good); font-weight:600; margin:4px 2px 0;}
.btnrow{display:flex; gap:8px; margin-top:10px;}
button.big{flex:1; border:none; border-radius:10px; padding:12px; font-size:1.1rem;
  font-family:inherit; font-weight:700; cursor:pointer;}
#submit{background:var(--accent); color:#fff;}
#submit:disabled{opacity:.45;}
.ghost{background:transparent; border:2px solid var(--line); color:var(--ink);
  border-radius:10px; padding:10px 14px; font-family:inherit; font-size:1rem; cursor:pointer;}
#msg{min-height:1.6em; text-align:center; font-weight:600; margin:8px 0; color:var(--accent);}
#msg.ok{color:var(--good);}
#keypad{margin-top:10px; user-select:none;}
.krow{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-bottom:6px;}
.krow button{min-width:44px; padding:9px 6px; font-size:1.15rem; border:1px solid var(--line);
  background:#fff; border-radius:9px; font-family:inherit; cursor:pointer;}
.krow button:active{background:var(--accent-soft);}
.krow.lbl{font-size:.75rem; color:var(--muted); margin:8px 0 4px; letter-spacing:1px;}
.krow button.fn{background:var(--ink); color:var(--paper); border-color:var(--ink);}
#result{display:none; text-align:center; background:var(--card); border:2px solid var(--good);
  border-radius:16px; padding:20px; margin-top:14px;}
#result.show{display:block;}
#result h2{font-family:"Baloo Tamma 2",sans-serif; margin:0 0 6px; color:var(--good);}
#chainview{font-size:1.1rem; line-height:2; margin:10px 0;}
footer{text-align:center; color:var(--muted); font-size:.8rem; margin-top:26px;}
.shake{animation:shake .3s;}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
</style>
</head>

  p:"ಪ",ph:"ಫ",b:"ಬ",bh:"ಭ",m:"ಮ",y:"ಯ",r:"ರ",l:"ಲ",
  v:"ವ",w:"ವ",sh:"ಶ",Sh:"ಷ",s:"ಸ",h:"ಹ",L:"ಳ"};
const DIGRAPH = ["kh","gh","ch","jh","Th","Dh","th","dh","ph","bh","sh","ai","au","ng","ny","Sh"];
function tokenizeLatin(s){
  const toks = []; let i = 0;
  while(i < s.length){
    let matched = null;
    for(const d of DIGRAPH) if(s.startsWith(d, i)){ matched = d; break; }
    if(matched){ toks.push(matched); i += matched.length; continue; }
    toks.push(s[i]); i++;
  }
  return toks;
}
function transliterate(s){
  const toks = tokenizeLatin(s);
  const units = toks.map(t =>
    CONS[t] ? {t:"c", base:CONS[t]} :
    V_INDEP[t] ? {t:"v", indep:V_INDEP[t], sign:V_SIGN[t]} :
    t === "M" ? {t:"s", ch:"ಂ"} : t === "H" ? {t:"s", ch:"ಃ"} : {t:"x", ch:t});
  let out = "", i = 0;
  while(i < units.length){
    const u = units[i], nx = units[i+1];
    if(u.t === "c"){
      if(nx && nx.t === "v"){ out += u.base + nx.sign; i += 2; continue; }
      if(nx && nx.t === "c"){ out += u.base + KN_HALANT; i += 1; continue; }
      out += u.base + (toks[i] === "T" ? KN_HALANT : ""); // "krikeT" -> ಕ್ರಿಕೆಟ್
      i += 1; continue;
    }
    out += (u.t === "v") ? u.indep : u.ch;
    i += 1;
  }
  return out;
}

/* ---------- keypad ---------- */
const VOWELS = ["ಅ","ಆ","ಇ","ಈ","ಉ","ಊ","ಎ","ಏ","ಐ","ಒ","ಓ","ಔ"];
const CONSS  = ["ಕ","ಖ","ಗ","ಘ","ಙ","ಚ","ಛ","ಜ","ಝ","ಞ","ಟ","ಠ","ಡ","ಢ","ಣ",
                "ತ","ಥ","ದ","ಧ","ನ","ಪ","ಫ","ಬ","ಭ","ಮ","ಯ","ರ","ಲ","ವ",
                "ಶ","ಷ","ಸ","ಹ","ಳ"];
const SIGNS  = ["ಾ","ಿ","ೀ","ು","ೂ","ೃ","ೆ","ೇ","ೈ","ೊ","ೋ","ೌ","ಂ","ಃ","್"];
function buildKeypad(){
  const kp = document.getElementById("keypad");
  const mk = (label, cls, fn) => {
    let sec = kp.querySelector(".krow." + cls);
    if(!sec){ sec = document.createElement("div"); sec.className = "krow " + cls; kp.appendChild(sec); }
    const b = document.createElement("button");
    b.textContent = label; b.onclick = fn; sec.appendChild(b); return b;
  };
  const inp = () => document.getElementById("guess");
  const lab = (t, cls) => { const d = document.createElement("div"); d.className = "krow lbl " + cls; d.textContent = t; kp.appendChild(d); };
  lab("ಸ್ವರ", "v"); VOWELS.forEach(v => mk(v, "v", () => inp().value += v));
  lab("ವ್ಯಂಜನ", "c"); CONSS.forEach(c => mk(c, "c", () => inp().value += c));
  lab("ಗುಣಿತಾಕ್ಷರ", "s"); SIGNS.forEach(s => mk(s, "s", () => {
    const el = inp(); if(el.value) el.value += s; // appends sign to last akshara
  }));
  const fns = document.createElement("div"); fns.className = "krow fn"; kp.appendChild(fns);
  const bk = document.createElement("button"); bk.textContent = "⌫"; bk.className = "fn";
  bk.onclick = () => { const el = inp(), a = aksharas(el.value); a.pop(); el.value = a.join(""); };
  const cl = document.createElement("button"); cl.textContent = "✕"; cl.className = "fn";
  cl.onclick = () => inp().value = "";
  fns.appendChild(bk); fns.appendChild(cl);
}

/* ---------- game state ---------- */
const $ = id => document.getElementById(id);
let mode = "daily";           // 'daily' | 'practice'
let puzzleIdx = 0, chain = [], done = false, usedHint = false;

function dayIndex(){
  const ms = Date.now() - new Date("2026-09-18T00:00:00").getTime();
  return Math.floor(ms / 86400000);
}
function pickPuzzle(){
  if(mode === "daily") puzzleIdx = ((dayIndex() % DATA.puzzles.length) + DATA.puzzles.length) % DATA.puzzles.length;
  else puzzleIdx = Math.floor(Math.random() * DATA.puzzles.length);
}
function todayKey(){ return new Date().toISOString().slice(0,10); }
function getStreak(){
  try{ return JSON.parse(localStorage.getItem("padamettilu-streak") || '{"n":0,"last":""}'); }
  catch(e){ return {n:0,last:""}; }
}
function setStreak(s){ localStorage.setItem("padamettilu-streak", JSON.stringify(s)); }

function startPuzzle(){
  const p = DATA.puzzles[puzzleIdx];
  chain = [p.start]; done = false; usedHint = false;
  $("guess").value = ""; $("latinprev").textContent = "";
  $("result").className = ""; $("result").innerHTML = "";
  $("entry").style.display = "";
  render();
  setMsg("");
}
function render(){
  const p = DATA.puzzles[puzzleIdx];
  $("puzzle-label").textContent = "#" + (puzzleIdx + 1) + " · " + p.theme;
  $("par-label").textContent = "Par " + p.par + " · " + p.difficulty;
  const st = getStreak(); $("streak").textContent = "🔥 " + st.n;
  const lad = $("ladder"); lad.innerHTML = "";
  const rung = (word, cls, tag) => {
    const d = document.createElement("div"); d.className = "rung " + cls;
    d.innerHTML = "<span>" + word + ' <span class="gloss">' + (GLOSS[word] || "") + "</span></span>" +
      (tag ? '<span class="taglbl">' + tag + "</span>" : "");
    lad.appendChild(d);
  };
  rung(p.start, "start", "ಆರಂಭ start");
  for(let i = 1; i < chain.length; i++) rung(chain[i], i === chain.length - 1 ? "cur" : "");
  rung(p.end, "end", "ಗುರಿ goal · " + p.par + " ಹೆಜ್ಜೆ");
  $("undo").disabled = chain.length <= 1;
}
function setMsg(t, ok){
  const m = $("msg"); m.textContent = t; m.className = ok ? "ok" : "";
  if(t){ m.classList.remove("shake"); void m.offsetWidth; m.classList.add("shake"); }
}
function normalizeGuess(raw){
  raw = raw.trim();
  if(!raw) return "";
  return /[a-zA-Z]/.test(raw) ? transliterate(raw) : raw;
}
function submit(){
  if(done) return;
  const p = DATA.puzzles[puzzleIdx];
  const g = normalizeGuess($("guess").value);
  if(!g) return;
  const cur = chain[chain.length - 1];
  if(g === cur){ setMsg("ಅದೇ ಪದ! try a different word"); return; }
  if(aksharas(g).length !== aksharas(p.start).length){
    setMsg("ಅಕ್ಷರಗಳ ಸಂಖ್ಯೆ " + aksharas(p.start).length + " ಆಗಿರಬೇಕು · needs " + aksharas(p.start).length + " aksharas"); return;
  }
  if(!oneApart(cur, g)){ setMsg("ಒಂದು ಅಕ್ಷರ ಮಾತ್ರ ಬದಲಾಯಿಸಿ · change exactly one akshara"); return; }
  if(!WORDS.includes(g)){ setMsg("ಪದಕೋಶದಲ್ಲಿ ಇಲ್ಲ · not a known word"); return; }
  chain.push(g); $("guess").value = ""; $("latinprev").textContent = "";
  if(g === p.end) win(); else { setMsg("", true); render(); }
}
function win(){
  done = true;
  const p = DATA.puzzles[puzzleIdx];
  const steps = chain.length - 1;
  if(mode === "daily"){
    const st = getStreak(), tk = todayKey();
    const y = new Date(Date.now() - 86400000).toISOString().slice(0,10);
    st.n = (st.last === y) ? st.n + 1 : (st.last === tk ? st.n : 1);
    st.last = tk; setStreak(st);
    localStorage.setItem("padamettilu-daily-" + tk, JSON.stringify({puzzleIdx, steps}));
  }
  render();
  $("entry").style.display = "none";
  const r = $("result"); r.className = "show";
  let verdict, emoji;
  if(steps <= p.par){ verdict = "ಅದ್ಭುತ! Perfect par! 🎯"; emoji = "🎯"; }
  else if(steps === p.par + 1){ verdict = "ಚೆನ್ನಾಗಿದೆ! Just over par."; emoji = "✅"; }
  else { verdict = "ಮುಗಿಯಿತು! Completed."; emoji = "✅"; }
  r.innerHTML = "<h2>" + verdict + "</h2>" +
    "<div>" + p.start + " → " + p.end + " · <b>" + steps + "</b>/" + p.par + " ಹೆಜ್ಜೆ" +
    (usedHint ? " · ಸುಳಿವು ಬಳಸಲಾಗಿದೆ" : "") + "</div>" +
    '<div id="chainview">' + chain.join(" → ") + "</div>" +
    '<div class="btnrow"><button class="big" id="share" style="background:var(--good);color:#fff">ಹಂಚಿಕೊಳ್ಳಿ · Share</button>' +
    (mode === "practice" ? '<button class="ghost" id="again">ಮತ್ತೊಂದು ↻</button>' : "") + "</div>";
  $("share").onclick = share;
  const ag = $("again"); if(ag) ag.onclick = () => { pickPuzzle(); startPuzzle(); };
}
function share(){
  const p = DATA.puzzles[puzzleIdx], steps = chain.length - 1;
  const txt = "ಪದಮೆಟ್ಟಿಲು #" + (puzzleIdx + 1) + ": " + p.start + " → " + p.end +
    " (" + steps + "/" + p.par + ") " + (steps <= p.par ? "🎯" : "✅");
  (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject())
    .then(() => setMsg("ನಕಲಿಸಲಾಗಿದೆ! Copied — paste it anywhere", true))
    .catch(() => { window.prompt("Copy your result:", txt); });
}
function hint(){
  if(done) return;
  const p = DATA.puzzles[puzzleIdx], cur = chain[chain.length - 1];
  const path = shortestPath(cur, p.end);
  if(!path || path.length < 2){ setMsg("ಸುಳಿವು ಇಲ್ಲ · no hint available"); return; }
  usedHint = true;
  chain.push(path[1]); $("guess").value = ""; $("latinprev").textContent = "";
  if(path[1] === p.end) win(); else render();
}

/* ---------- wiring ---------- */
$("submit").onclick = submit;
$("guess").addEventListener("keydown", e => { if(e.key === "Enter") submit(); });
$("guess").addEventListener("input", e => {
  // Latin is converted on submit, not while typing (live conversion corrupts
  // partial input like "m" -> "ಮ"). Show a preview of the converted form.
  const v = e.target.value, pv = $("latinprev");
  pv.textContent = /[a-zA-Z]/.test(v) ? "→ " + transliterate(v) : "";
});
$("undo").onclick = () => { if(chain.length > 1 && !done){ chain.pop(); render(); } };
$("hint").onclick = hint;
$("m-daily").onclick = () => { mode = "daily"; $("m-daily").classList.add("on"); $("m-practice").classList.remove("on"); pickPuzzle(); startPuzzle(); };
$("m-practice").onclick = () => { mode = "practice"; $("m-practice").classList.add("on"); $("m-daily").classList.remove("on"); pickPuzzle(); startPuzzle(); };

buildKeypad();
pickPuzzle();
startPuzzle();
</script>
</body>
